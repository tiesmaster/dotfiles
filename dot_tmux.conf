# Change c-b as prefix to c-<space>
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# This is needed to allow programs to send OSC52 copy/paste commands, *without*
# needing to send a "DCS passthrough" to escape it for tmux. Before, this
# needed allow-passthrough, and support in the client for that.
set -s set-clipboard on

# Pass modified keys (e.g. Shift+Enter) through to programs, instead of
# collapsing them into the plain key.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

set -g detach-on-destroy off

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# VPN indicator (see vpn-in-tmux in ~/.bashrc.d/tmux), in front of the default status-right
set -g status-right-length 80
set -g status-right '#{?@vpn,#[fg=black bg=#{?#{==:#{@vpn_state},up},green,red}] VPN #{@vpn} #{@vpn_state} #[default] ,}#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'

# Sessions (F1–F4)
bind -n F1 command-prompt -p "New session:" "new-session -A -s '%%'"
bind -n F2 switch-client -p
bind -n F3 switch-client -n
bind -n F4 confirm-before -p "Kill session #S? (y/n)" kill-session

# Windows (F5–F8)
bind -n F5 new-window
bind -n F6 previous-window
bind -n F7 next-window
# move the current window one position to the left (-d keeps it selected)
bind -n F8 swap-window -d -t -1

bind r {
  source-file ~/.tmux.conf
  display 'config reloaded'
}
