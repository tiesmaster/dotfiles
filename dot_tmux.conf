# ── Prefix Key ──────────────────────────

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── General Settings ─────────────────────

# This is needed to allow programs to send OSC52 copy/paste commands, *without*
# needing to send a "DCS passthrough" to escape it for tmux. Before, this
# needed allow-passthrough, and support in the client for that.
set -s set-clipboard on

# Pass modified keys (e.g. Shift+Enter) through to programs, instead of
# collapsing them into the plain key.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

set -g detach-on-destroy off

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-window-option -g mode-keys vi

# ── Keybindings ─────────────────────────

# Sessions (F1–F4)
bind -n F1 command-prompt -p "New session:" "new-session -A -s '%%'"
bind -n F2 switch-client -p
bind -n F3 switch-client -n
bind -n F4 confirm-before -p "Kill session #S? (y/n)" kill-session

# Windows (F5–F7)
bind -n F5 new-window
bind -n F6 previous-window
bind -n F7 next-window

bind r {
  source-file ~/.tmux.conf
  display 'config reloaded'
}
